<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词生成器合集</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--t2:#6e6e73;--t3:#86868b;--border:#d2d2d7;--accent:#0071e3;--r:18px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:64px 24px}
.wrap{max-width:760px;width:100%;text-align:center}
h1{font-size:38px;font-weight:700;letter-spacing:-1px;margin-bottom:10px}
.sub{font-size:16px;color:var(--t3);margin-bottom:48px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:40px}
@media(max-width:640px){.cards{grid-template-columns:1fr}h1{font-size:30px}}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:36px 28px;text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
.emoji{font-size:42px;margin-bottom:14px}
.card h2{font-size:20px;font-weight:650;margin-bottom:6px}
.card p{font-size:13.5px;color:var(--t2)}
.tag{display:inline-block;margin-top:12px;font-size:11.5px;color:var(--accent);background:rgba(0,113,227,.08);padding:3px 10px;border-radius:999px}
.note{font-size:13px;color:var(--t3);line-height:1.7;margin-top:8px}
.note b{color:var(--t2);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<h1>提示词生成器</h1>
<p class="sub">单文件 · 离线可用 · 内置防漂移方法论</p>
<div class="cards">
<a class="card" href="suno-prompt-generator.html">
<div class="emoji">🎵</div>
<h2>Suno 音乐</h2>
<p>16 曲风 · Style 标签 / 主提示词 / Lyrics / 分段 / 风险清单</p>
<span class="tag">英文 prompt</span>
</a>
<a class="card" href="jimeng-image-prompt-generator.html">
<div class="emoji">🎨</div>
<h2>即梦图像</h2>
<p>16 风格 · 中文提示词 / 负向 / 英文关键词 / 参数 / 防漂移</p>
<span class="tag">中文 prompt</span>
</a>
</div>
<p class="note">点卡片进入工具,左边填、右边出,每个卡片一键复制。<br><b>也可整页另存到本地</b>:浏览器菜单 → 另存为 → 双击打开即离线使用。</p>
</div>
</body>
</html>
